services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hitalent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hitalent"]
      interval: 5s
      timeout: 5s
      retries: 3
  migrate:
    image: kukymbr/goose-docker:3.27.1
    volumes:
      - ./migrations:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://postgres:postgres@postgres:5432/hitalent?sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations
    command: goose up
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: :8080
      DB_CONNECT: postgres://postgres:postgres@postgres:5432/hitalent?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
